name: Sample reel (branch test)
on:
  push:
    branches: [reel-v2]
    paths: ['tools/render_reel.py', 'tools/product_media.py', 'samples/sample_payload.json', '.github/workflows/sample-reel.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow requests edge-tts beautifulsoup4 lxml
      - name: Debug video urls
        run: python tools/product_media.py --debug B0D78YCR1K > samples/media_debug.txt 2>&1 || true
      - name: Render
        env:
          JOB_ID: sample
        run: |
          export PAYLOAD="$(cat samples/sample_payload.json)"
          python tools/render_reel.py > samples/render.log 2>&1 || true
          cp out/reel.mp4 samples/reel.mp4 2>/dev/null || true
          cp out/meta.json samples/meta.json 2>/dev/null || true
      - name: Save
        run: |
          git config user.name sample; git config user.email sample@users.noreply.github.com
          git add samples/media_debug.txt samples/render.log samples/reel.mp4 samples/meta.json || true
          git commit -m "sample reel result" && git push
