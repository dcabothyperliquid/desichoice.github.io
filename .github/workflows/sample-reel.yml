name: Sample reel (branch test)
on:
  push:
    branches: [reel-v2]
    paths: ['tools/render_reel.py', 'tools/product_media.py', 'samples/sample_multi.json', '.github/workflows/sample-reel.yml']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr
          pip install -q pillow requests edge-tts beautifulsoup4 lxml pytesseract
      - name: Render
        env:
          JOB_ID: sample
        run: |
          export PAYLOAD="$(cat samples/sample_multi.json)"
          mkdir -p samples/res
          DEBUG_MONTAGE= python tools/render_reel.py > samples/render_a.log 2>&1 || true
          cp out/reel.mp4 samples/res/reel_fixed.mp4 2>/dev/null || true
      - name: Save
        run: |
          git config user.name sample; git config user.email sample@users.noreply.github.com
          git add samples/res samples/render_a.log || true
          git commit -m "multi sample result" && git push
