name: Probe deals filters (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python tools/probe_in3.py
      - name: Commit result
        run: |
          git config user.name "india-scan-bot"; git config user.email "india-scan-bot@users.noreply.github.com"
          git add guides/probe5.json
          git commit -qm "probe3: deals filters" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
